name: MLOps CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate-train-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m src.data_generation
      - run: python -c "import pandas as pd; from src.data_validation import validate_dataset; [validate_dataset(pd.read_csv(f'data/dataset_v{i}.csv'), min_records=250) for i in (1,2)]"
      - run: python -m src.feature_store
      - run: python -m src.train
      - run: python -m pytest -q
      - run: python -m compileall -q src app.py tests
